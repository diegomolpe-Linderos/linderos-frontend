<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard BIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#FF864A; --naranja-osc:#E8662A; --naranja-suave:#FFE3D4;
  --ambar:#F2B43F; --ambar-suave:#FCEFD2;
  --verde:#5E9A3E; --verde-suave:#E4F0DA;
  --azul:#2F6DB5; --azul-suave:#DDE9F6;
  --rojo:#C4382F; --rojo-suave:#F9D9D6;
  --tinta:#23272D; --tinta-2:#5B6370; --tinta-3:#9AA1AC;
  --linea:#E3E5E9; --fondo:#F3F4F6; --papel:#FFFFFF;
  --sombra:0 1px 2px rgba(35,39,45,.06),0 4px 14px rgba(35,39,45,.05);
  --r:10px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --naranja-suave:#4A2A1B; --ambar-suave:#3F3217; --verde-suave:#22321A; --azul-suave:#1B2A3D; --rojo-suave:#4A1F1C;
    --tinta:#ECEEF1; --tinta-2:#B3BAC4; --tinta-3:#7C8490; --linea:#343942; --fondo:#16181C; --papel:#1F2227;
    --sombra:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --naranja-suave:#4A2A1B; --ambar-suave:#3F3217; --verde-suave:#22321A; --azul-suave:#1B2A3D; --rojo-suave:#4A1F1C;
  --tinta:#ECEEF1; --tinta-2:#B3BAC4; --tinta-3:#7C8490; --linea:#343942; --fondo:#16181C; --papel:#1F2227;
  --sombra:0 1px 2px rgba(0,0,0,.4);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:16px}

/* Encabezado */
.cabecera{background:var(--naranja);color:#fff;border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;box-shadow:var(--sombra)}
.cabecera .izq{min-width:0}
.fila-bip{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fila-bip label{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;letter-spacing:.02em;opacity:.9}
.buscador{position:relative}
.buscador input{background:#fff;color:#23272D;border:0;border-radius:8px;padding:8px 12px;font-size:22px;font-weight:700;width:220px;font-variant-numeric:tabular-nums}
.lista{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:min(560px,86vw);max-height:340px;overflow:auto;background:var(--papel);color:var(--tinta);border:1px solid var(--linea);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none}
.lista.abierta{display:block}
.lista button{display:grid;grid-template-columns:110px 1fr;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--linea)}
.lista button:hover,.lista button[aria-selected="true"]{background:var(--naranja-suave)}
.lista b{font-variant-numeric:tabular-nums}
.lista span{color:var(--tinta-2);font-size:12.5px;line-height:1.3}
.nombre-proy{font-family:"Barlow Semi Condensed",sans-serif;font-size:clamp(18px,2.1vw,26px);font-weight:700;line-height:1.15;margin:12px 0 0;max-width:70ch}
.der{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.der img{height:78px;width:auto;border-radius:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:#fff;color:var(--naranja-osc)}
.btn:hover{background:#FFF1E9}
.frescura{font-size:12.5px;opacity:.95;text-align:right}

.franja{margin-top:10px;background:var(--ambar);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px 20px;align-items:center;color:#2B2410;box-shadow:var(--sombra)}
.dato small{display:block;font-size:12px;opacity:.75}
.dato strong{font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(255,255,255,.55);border-radius:8px;padding:6px 12px;text-align:center;min-width:120px}
.chip small{display:block;font-size:11.5px;opacity:.8}
.chip strong{font-size:15px}
.chip.alerta{background:var(--rojo);color:#fff}

/* Tarjetas */
.tarjeta{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);margin-top:16px;overflow:hidden;border-top:4px solid var(--c,var(--naranja))}
.tarjeta.verde{--c:var(--verde)} .tarjeta.azul{--c:var(--azul)} .tarjeta.gris{--c:#8A919C}
.t-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px 8px}
.t-cab h2{margin:0;font-family:"Barlow Semi Condensed",sans-serif;font-size:19px;font-weight:700;color:var(--c,var(--naranja))}
.t-cab p{margin:2px 0 0;color:var(--tinta-2);font-size:12.5px}
.aviso{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--verde-suave);color:var(--verde)}
.aviso.mal{background:var(--rojo-suave);color:var(--rojo)}
.avisos{display:flex;gap:8px;flex-wrap:wrap}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:13px;color:var(--tinta-2);text-align:left;padding:8px 8px;border-bottom:2px solid var(--linea);background:var(--papel);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--linea);white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--c,var(--naranja)) 7%,var(--papel))}
td.cod{color:var(--tinta-3);font-size:12.5px;font-variant-numeric:tabular-nums}
tr.cero td{color:var(--tinta-3)}
tr.total td{font-weight:700;background:var(--naranja-suave);border-bottom:0}
tr.acum td{font-weight:600;color:var(--tinta-2);background:color-mix(in srgb,var(--naranja-suave) 45%,var(--papel))}
.verde tr.total td{background:var(--verde-suave)}
.gris tr.total td{background:color-mix(in srgb,#8A919C 18%,var(--papel))}
th.grupo{border-left:2px solid var(--linea)} td.grupo{border-left:2px solid var(--linea)}
.sticky{position:sticky;left:0;z-index:2;background:var(--papel);box-shadow:6px 0 6px -6px rgba(0,0,0,.15);min-width:160px}
.sticky2{position:sticky;left:118px;z-index:2;background:var(--papel);box-shadow:6px 0 6px -6px rgba(0,0,0,.15)}
tr.total .sticky{background:var(--naranja-suave)} .verde tr.total .sticky{background:var(--verde-suave)}
tr.acum .sticky{background:color-mix(in srgb,var(--naranja-suave) 45%,var(--papel))}
td.neg{color:var(--rojo);background:var(--rojo-suave)!important;font-weight:600}
td.exceso{color:var(--rojo);background:var(--rojo-suave)!important;font-weight:700}
td.arr{background:var(--ambar-suave)}
.pie{padding:8px 16px 14px;color:var(--tinta-2);font-size:12.5px;display:flex;gap:18px;flex-wrap:wrap}
.pie b{color:var(--tinta)}

.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.dos .tarjeta{margin-top:16px} .dos>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 14px}
.kpi{border-radius:8px;background:color-mix(in srgb,var(--c) 12%,var(--papel));padding:8px 12px}
.kpi small{display:block;color:var(--tinta-2);font-size:12px}
.kpi strong{font-size:19px;font-variant-numeric:tabular-nums}
.kpi.mal{background:var(--rojo-suave)} .kpi.mal strong{color:var(--rojo)}
.asig-bloque{padding:4px 0 10px}
.asig-bloque h3{margin:6px 16px 4px;font-size:14px;font-family:"Barlow Semi Condensed",sans-serif;display:flex;align-items:center;gap:8px}
.badge{background:var(--azul);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px}
td.vence{color:var(--rojo);background:var(--rojo-suave)} td.vence .nota{color:var(--rojo);opacity:.8}
.nota{color:var(--tinta-3);font-size:12px}
.vacio{padding:16px;color:var(--tinta-2)}

/* Carga */
.velo{position:fixed;inset:0;background:rgba(20,22,26,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.velo.on{display:flex}
.caja{background:var(--papel);color:var(--tinta);border-radius:14px;padding:22px 24px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.caja h3{margin:0 0 6px;font-family:"Barlow Semi Condensed",sans-serif;font-size:20px}
.caja p{margin:6px 0;color:var(--tinta-2)}
.caja ul{margin:8px 0;padding-left:18px;color:var(--tinta-2);font-size:13px;max-height:160px;overflow:auto}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden;margin:14px 0 4px}
.barra i{display:block;height:100%;width:40%;background:var(--naranja);border-radius:3px;animation:ir 1.1s ease-in-out infinite}
@keyframes ir{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.barra i{animation:none;width:100%}}
.acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn.prim{background:var(--naranja);color:#fff}.btn.prim:hover{background:var(--naranja-osc)}
.btn.sec{background:var(--fondo);color:var(--tinta)}
.soltar{position:fixed;inset:0;border:4px dashed var(--naranja);background:rgba(255,134,74,.12);z-index:90;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--naranja-osc)}
.soltar.on{display:flex}

@media (max-width:1020px){ .dos{grid-template-columns:minmax(0,1fr)} .franja{grid-template-columns:1fr 1fr} .chips{grid-column:1/-1;justify-content:flex-start} }
@media (max-width:640px){
  .wrap{padding:10px}
  .cabecera{grid-template-columns:1fr} .der{flex-direction:row;align-items:center;justify-content:space-between}
  .der img{height:52px}
  .franja{grid-template-columns:1fr} .kpis{grid-template-columns:1fr 1fr}
  .buscador input{width:180px;font-size:19px}
  .sticky{min-width:150px}
}
@media print{ .der .btn,.velo,.soltar{display:none!important} body{background:#fff} .tarjeta,.cabecera,.franja{box-shadow:none} }

/* Pantalla de clave de acceso */
.candado{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--fondo)}
.candado-caja{background:var(--papel);border-radius:14px;padding:32px 28px;max-width:360px;width:100%;box-shadow:var(--sombra);text-align:center}
.candado-caja img{height:56px;margin-bottom:10px}
.candado-caja h1{font-family:"Barlow Semi Condensed",sans-serif;font-size:22px;margin:6px 0}
.candado-caja p{color:var(--tinta-2);font-size:13.5px;margin:0 0 16px}
.candado-caja input{width:100%;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;font-size:16px;background:var(--fondo);color:var(--tinta);margin-bottom:12px;text-align:center}
.candado-caja input.mal{border-color:var(--rojo)}
.candado-caja .btn{width:100%;justify-content:center;padding:10px}
.candado-error{color:var(--rojo);font-size:13px;margin:10px 0 0}

.acciones-cab{display:flex;align-items:center;gap:12px}
.linkSalir{background:none;border:0;color:#fff;text-decoration:underline;font-size:12.5px;cursor:pointer;padding:2px 0;opacity:.9}
.linkSalir:hover{opacity:1}
@media (max-width:640px){ .acciones-cab{gap:8px} }

</style>
</head>

<script>
/* Cifrado/descifrado compartido entre Node (al construir el archivo) y el navegador (al abrirlo). */
function b64e(bytes){ let s=''; bytes=new Uint8Array(bytes); for(const b of bytes) s+=String.fromCharCode(b); return btoa(s); }
function b64d(str){ const s=atob(str); const arr=new Uint8Array(s.length); for(let i=0;i<s.length;i++) arr[i]=s.charCodeAt(i); return arr; }
async function derivarClave(subtle,password,salt){
  const enc=new TextEncoder();
  const base=await subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifrarTexto(subtle,password,texto){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await derivarClave(subtle,password,salt);
  const buf=await subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(texto));
  return {enc:1,salt:b64e(salt),iv:b64e(iv),data:b64e(buf)};
}
async function descifrarTexto(subtle,password,payload){
  const salt=b64d(payload.salt), iv=b64d(payload.iv), data=b64d(payload.data);
  const key=await derivarClave(subtle,password,salt);
  const buf=await subtle.decrypt({name:'AES-GCM',iv},key,data);
  return new TextDecoder().decode(buf);
}

<script>
/* Extrae de la Planilla_de_Analisis_BIP (libro SheetJS) el modelo compacto que usa el dashboard.
   Replica las fórmulas de la hoja RESUMEN. */
function extractModel(XLSX, wb){
  const warn=[];
  const get=(name)=>{const ws=wb.Sheets[name]; if(!ws) throw new Error('Falta la hoja "'+name+'" en el archivo.'); return ws;};
  const rowsOf=(ws)=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const colIdx=(L)=>XLSX.utils.decode_col(L);
  const norm=(v)=>v==null?'':String(v).replace(/\s+/g,' ').trim().toLowerCase();
  function resolve(hdr, sheet, label, letter, occ){
    occ=occ||1; let seen=0;
    for(let i=0;i<hdr.length;i++){ if(norm(hdr[i])===norm(label)){ seen++; if(seen===occ) return i; } }
    warn.push(sheet+': no se encontró la columna "'+label+'", se usa la columna '+letter+'.');
    return colIdx(letter);
  }
  const num=(v)=>{ if(v==null||v==='') return 0; if(typeof v==='number') return isFinite(v)?v:0; const n=Number(String(v).replace(/\./g,'').replace(',','.')); return isFinite(n)?n:0; };
  const str=(v)=>v==null?'':String(v).trim();
  const toDate=(v)=>{
    if(v==null||v==='') return null;
    if(v instanceof Date) return isNaN(v)?null:v.toISOString().slice(0,10);
    if(typeof v==='number'){ if(v<1) return null; const d=XLSX.SSF.parse_date_code(v); return d? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null; }
    const m=String(v).match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/); if(m){let y=+m[3]; if(y<100)y+=2000; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
    return null;
  };
  const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const MLET=['AE','AF','AG','AH','AI','AJ','AK','AL','AM','AN','AO','AP'];

  const ps=rowsOf(get('P_SAFI')); const ph=ps[1]||[];
  const pc={key:resolve(ph,'P_SAFI','asignacion','C'), total:resolve(ph,'P_SAFI','Total Año','AW'), art:resolve(ph,'P_SAFI','ART 19','CL'),
            m:MONTHS.map((n,i)=>resolve(ph,'P_SAFI',n,MLET[i]))};
  const prog={};
  for(let r=2;r<ps.length;r++){ const row=ps[r]; if(!row) continue; const k=str(row[pc.key]); if(!k) continue;
    const a=prog[k]||(prog[k]=new Array(14).fill(0));
    a[0]+=num(row[pc.total]); a[1]+=num(row[pc.art]); pc.m.forEach((c,i)=>a[2+i]+=num(row[c])); }
  const fechaSafi=toDate((ps[0]||[])[2]);

  const ld=rowsOf(get('Libro_Decreto')); const lh=ld[1]||[];
  const lc={key:resolve(lh,'Libro_Decreto','asig','Q'), bip:resolve(lh,'Libro_Decreto','BIP','D'),
            dec:resolve(lh,'Libro_Decreto','DECRETO','Z',2), dip:resolve(lh,'Libro_Decreto','EN DIPRES','AA',2),
            dir:resolve(lh,'Libro_Decreto','EN DIRPLAN','AB',2), cgr:resolve(lh,'Libro_Decreto','Decreto en CGR','AC',2),
            tot:resolve(lh,'Libro_Decreto','TOTAL','AD'), art:resolve(lh,'Libro_Decreto','ART 19','AE')};
  const dec={}, decBip={};
  for(let r=2;r<ld.length;r++){ const row=ld[r]; if(!row) continue; const k=str(row[lc.key]); const b=str(row[lc.bip]);
    if(k){ const a=dec[k]||(dec[k]=[0,0,0,0,0,0]); a[0]+=num(row[lc.tot]); a[1]+=num(row[lc.art]); a[2]+=num(row[lc.dec]); a[3]+=num(row[lc.cgr]); a[4]+=num(row[lc.dip]); a[5]+=num(row[lc.dir]); }
    if(b){ decBip[b]=(decBip[b]||0)+num(row[lc.art]); } }
  const fechaDecreto=toDate((ld[0]||[])[2]);

  const bd=rowsOf(get('BD_CONSOLIDADO')); const bh=bd[5]||[];
  const bc={bip:resolve(bh,'BD_CONSOLIDADO','BIP','B'), asig:resolve(bh,'BD_CONSOLIDADO','asig','D'), key:resolve(bh,'BD_CONSOLIDADO','asignacion','E'),
    unidad:resolve(bh,'BD_CONSOLIDADO','Unidad','G'), region:resolve(bh,'BD_CONSOLIDADO','Resumen','H'), estado:resolve(bh,'BD_CONSOLIDADO','Estado contrato','I'),
    orig:resolve(bh,'BD_CONSOLIDADO','CONTRATO ORIGINAL','J'), ncon:resolve(bh,'BD_CONSOLIDADO','N°CONTRATO','K'), fterm:resolve(bh,'BD_CONSOLIDADO','Fecha Termino','N'),
    rate:resolve(bh,'BD_CONSOLIDADO','RATE','O'), tipo:resolve(bh,'BD_CONSOLIDADO','TIPO DE CONTRATO','P'), saldo:colIdx('T'),
    pagado:resolve(bh,'BD_CONSOLIDADO','Total Pagado','AA'), arr:[colIdx('AO'),colIdx('AP'),colIdx('AQ'),colIdx('AR')]};
  const arrLabel=str((bd[3]||[])[colIdx('AO')])||'Sí - Arrastre';
  const bips={}, arrByKey={}, cmap={};
  for(let r=6;r<bd.length;r++){ const row=bd[r]; if(!row) continue; const b=str(row[bc.bip]); if(!b) continue;
    if(!bips[b]) bips[b]={u:str(row[bc.unidad]), r:str(row[bc.region]), rate:str(row[bc.rate]), tipo:str(row[bc.tipo])};
    const k=str(row[bc.key]); if(k && !(k in arrByKey)) arrByKey[k]=bc.arr.map(c=>num(row[c]));
    const as=str(row[bc.asig]); if(!as) continue;
    const nc=row[bc.ncon], og=row[bc.orig];
    const t=[as,str(nc),str(og),str(row[bc.estado]),toDate(row[bc.fterm])||''];
    const id=b+'|'+t.join('|');
    const c=cmap[id]||(cmap[id]={b,t,p:0,s:0}); c.p+=num(row[bc.pagado]); c.s+=num(row[bc.saldo]); }
  const contracts={};
  Object.values(cmap).forEach(c=>{ (contracts[c.b]||(contracts[c.b]=[])).push([...c.t, Math.round(c.p*1000)/1000, Math.round(c.s*1000)/1000]); });
  Object.values(contracts).forEach(l=>l.sort((x,y)=> x[0]<y[0]?-1:x[0]>y[0]?1:(x[1].localeCompare(y[1],undefined,{numeric:true}))));

  const bi=rowsOf(get('BcoInt')); const names={};
  for(let r=2;r<bi.length;r++){ const row=bi[r]; if(!row) continue; const b=str(row[0]); if(b && !(b in names)) names[b]=str(row[2]); }

  const rateNames={'AD':'Admisible','CF':'Con Financiamiento','FI':'Falta de Información','IN':'Incumplimiento de Normativa','OT':'Objetado Técnicamente','RE':'Reevaluación','RS':'Recomendado Favorablemente'};
  if(wb.Sheets['Datos_Generales']){ const dg=rowsOf(wb.Sheets['Datos_Generales']);
    for(let r=37;r<45 && r<dg.length;r++){ const row=dg[r]||[]; const k=str(row[5]); if(k) rateNames[k]=str(row[6]); } }

  let defaultBip='';
  if(wb.Sheets['RESUMEN']){ const c=wb.Sheets['RESUMEN']['C4']; if(c && bips[str(c.v)]) defaultBip=str(c.v); }
  if(!defaultBip) defaultBip=Object.keys(bips)[0]||'';

  const keep=(obj)=>{const o={}; for(const k in obj){ const b=k.replace(/-[^-]+$/,''); if(bips[b]) o[k]=obj[k].map(v=>Math.round(v*1e6)/1e6);} return o;};
  return {v:1, meta:{fechaSafi,fechaDecreto,arrLabel,generado:new Date().toISOString(),defaultBip},
          bips, names:Object.fromEntries(Object.entries(names).filter(([b])=>bips[b])), rateNames,
          prog:keep(prog), dec:keep(dec), decBip:Object.fromEntries(Object.entries(decBip).filter(([b])=>bips[b])),
          arr:keep(arrByKey), contracts, warn};
}

function arrancar(modelo){
M=modelo;
try{ const loc=JSON.parse(localStorage.getItem(LS_MODEL)||'null'); if(loc && loc.v===M.v && loc.meta && loc.meta.generado>M.meta.generado) M=loc; }catch(e){}
root.innerHTML=''; root.appendChild(tpl.content.cloneNode(true));

const fmtN=new Intl.NumberFormat('es-CL',{maximumFractionDigits:0});
const f=v=>(v==null||Math.abs(v)<0.5)?'-':fmtN.format(Math.round(v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha=iso=>{ if(!iso) return ''; const [y,m,d]=iso.slice(0,10).split('-'); return `${d}-${m}-${y}`; };
const anio=()=>(M.meta.fechaSafi||'2026').slice(0,4);

// ---------- Cálculo (réplica de la hoja RESUMEN) ----------
function calcular(b){
  const filas=ASIGS.map(([cod,nom,ia])=>{
    const k=b+'-'+cod, p=M.prog[k]||[], d=M.dec[k]||[], a=M.arr[k]||[];
    const meses=MESES.map((_,i)=>p[2+i]||0);
    const fin=d[0]||0;
    let s=fin; const saldo=meses.map(m=>(s-=m));
    return {cod,nom,clave:k, anual:p[0]||0, art:p[1]||0, meses, fin, finArt:d[1]||0, arr:a[ia]||0,
            decretado:d[2]||0, cgr:d[3]||0, dipres:d[4]||0, dirplan:d[5]||0, saldo};
  });
  filas.forEach(r=>{ r.totProg=r.anual+r.art; r.totFin=r.fin+r.finArt; r.totDec=r.decretado+r.cgr+r.dipres+r.dirplan;
    r.exceso=r.totProg>0 && r.totProg>r.fin+0.5; r.activa=[r.anual,r.art,r.fin,r.finArt,r.arr,r.totDec].some(v=>Math.abs(v)>=0.5); });
  const sum=(fn)=>filas.reduce((t,r)=>t+fn(r),0);
  const mesesTot=MESES.map((_,i)=>sum(r=>r.meses[i])); let ac=0; const acum=mesesTot.map(v=>(ac+=v));
  const finD=sum(r=>r.fin), finE=M.decBip[b]||0;
  const dec={decretado:sum(r=>r.decretado),cgr:sum(r=>r.cgr),dipres:sum(r=>r.dipres),dirplan:sum(r=>r.dirplan)}; dec.tot=dec.decretado+dec.cgr+dec.dipres+dec.dirplan;
  // Mes hasta el que alcanza el financiamiento: el mes previo al primer saldo negativo
  let primerNeg=12; filas.forEach(r=>{ if(r.anual>=0.5){ const i=r.saldo.findIndex(v=>v<-0.5); if(i>=0 && i<primerNeg) primerNeg=i; } });
  const faltan=filas.filter(r=>r.anual>=0.5 && r.saldo[11]<-0.5).map(r=>({cod:r.cod,monto:-r.saldo[11]}));
  return {filas,mesesTot,acum,tot:{anual:sum(r=>r.anual),art:sum(r=>r.art),prog:sum(r=>r.totProg)},
          fin:{d:finD,e:finE,t:finD+finE,arr:sum(r=>r.arr)},dec,dif:dec.tot-finD,primerNeg,faltan};
}

// ---------- Render ----------
function render(b){
  const info=M.bips[b]; if(!info) return;
  const C=calcular(b), A=anio();
  $('bip').value=b; $('nombre').textContent=M.names[b]||'Sin nombre en Banco Integrado';
  $('unidad').textContent=info.u||'-'; $('region').textContent=info.r||'-';
  $('tipo').textContent=info.tipo||'-';
  $('rate').textContent=(info.rate||'Sin RATE')+(M.rateNames[info.rate]?' · '+M.rateNames[info.rate]:'');
  const circ=(info.rate||'').toLowerCase()==='s/rate' && (info.tipo||'').toLowerCase()==='conservacion';
  $('circ').textContent=circ?'Solicitar a mantenimiento':'No'; $('chipCirc').classList.toggle('alerta',circ);
  document.title='BIP '+b+' · Resumen';

  // Programación
  const hm=MESES.map(m=>`<th class="n" title="${m}">${m.slice(0,3)}</th>`).join('');
  let h=`<thead><tr><th class="sticky">Asignación</th><th class="n">Año ${A}</th><th class="n">Art. 19</th><th class="n">Totales</th>${hm.replace('<th class="n">','<th class="n grupo">')}</tr></thead><tbody>`;
  C.filas.forEach(r=>{
    h+=`<tr class="${r.activa?'':'cero'}"><td class="sticky" title="${esc(r.clave)}">${r.cod} ${esc(r.nom)}</td>
      <td class="n ${r.exceso?'exceso':''}" ${r.exceso?`title="La programación supera el financiamiento (${f(r.fin)} M$)"`:''}>${f(r.anual)}</td><td class="n">${f(r.art)}</td><td class="n"><b>${f(r.totProg)}</b></td>
      ${r.meses.map((v,i)=>`<td class="n${i?'':' grupo'}">${f(v)}</td>`).join('')}</tr>`; });
  h+=`<tr class="total"><td class="sticky">Total programado</td><td class="n">${f(C.tot.anual)}</td><td class="n">${f(C.tot.art)}</td><td class="n">${f(C.tot.prog)}</td>${C.mesesTot.map((v,i)=>`<td class="n${i?'':' grupo'}">${f(v)}</td>`).join('')}</tr>`;
  h+=`<tr class="acum"><td class="sticky">Acumulado</td><td></td><td></td><td></td>${C.acum.map((v,i)=>`<td class="n${i?'':' grupo'}">${f(v)}</td>`).join('')}</tr></tbody>`;
  $('tProg').innerHTML=h;
  const ex=C.filas.filter(r=>r.exceso);
  $('avisoProg').innerHTML=(C.tot.anual<0.5?'<span class="aviso">Sin programación</span>':
    (C.primerNeg>=12?'<span class="aviso">Financiado a diciembre</span>':C.primerNeg===0?'<span class="aviso mal">Sin financiamiento desde enero</span>':`<span class="aviso mal">Financiado a ${MESES[C.primerNeg-1].toLowerCase()}</span>`))
    +ex.map(r=>`<span class="aviso mal">${r.cod}: programado supera lo financiado</span>`).join('');

  // Saldo mensual
  let s=`<thead><tr><th class="sticky">Asignación</th><th class="n">Financ. ${A}</th>${hm.replace('<th class="n">','<th class="n grupo">')}</tr></thead><tbody>`;
  C.filas.forEach(r=>{ s+=`<tr class="${r.activa?'':'cero'}"><td class="sticky" title="${esc(r.clave)}">${r.cod} ${esc(r.nom)}</td><td class="n"><b>${f(r.fin)}</b></td>${r.saldo.map((v,i)=>`<td class="n${i?'':' grupo'} ${v<-0.5?'neg':''}">${f(v)}</td>`).join('')}</tr>`; });
  $('tSaldo').innerHTML=s+'</tbody>';
  $('avisoSaldo').innerHTML=C.faltan.length?C.faltan.map(x=>`<span class="aviso mal">Falta financiamiento en ${x.cod}: ${f(x.monto)} M$</span>`).join(''):(C.tot.anual>=0.5?'<span class="aviso">Programación cubierta</span>':'');

  // Financiamiento
  $('kpiFin').innerHTML=`<div class="kpi"><small>Totales financiados</small><strong>${f(C.fin.t)}</strong></div>
    <div class="kpi"><small>Total programado</small><strong>${f(C.tot.prog)}</strong></div>
    <div class="kpi ${Math.abs(C.dif)>=0.5?'mal':''}"><small>Diferencia decretos vs. financiado</small><strong>${f(C.dif)}</strong></div>`;
  let fh=`<thead><tr><th>Asignación</th><th class="n">${A}</th><th class="n">Art. 19</th><th class="n">Totales</th><th class="n">${esc(M.meta.arrLabel)}</th></tr></thead><tbody>`;
  C.filas.forEach(r=>{ fh+=`<tr class="${r.activa?'':'cero'}"><td title="${esc(r.clave)}">${r.cod} ${esc(r.nom)}</td><td class="n ${r.exceso?'exceso':''}">${f(r.fin)}</td><td class="n">${f(r.finArt)}</td><td class="n"><b>${f(r.totFin)}</b></td><td class="n arr">${f(r.arr)}</td></tr>`; });
  fh+=`<tr class="total"><td>Totales financiados</td><td class="n">${f(C.fin.d)}</td><td class="n">${f(C.fin.e)}</td><td class="n">${f(C.fin.t)}</td><td class="n">${f(C.fin.arr)}</td></tr></tbody>`;
  $('tFin').innerHTML=fh;

  // Decretos
  let dh=`<thead><tr><th>Asignación</th><th class="n">Decretado</th><th class="n">En CGR</th><th class="n">En DIPRES</th><th class="n">En DIRPLAN</th><th class="n">Totales</th></tr></thead><tbody>`;
  C.filas.forEach(r=>{ dh+=`<tr class="${Math.abs(r.totDec)>=0.5||r.decretado||r.dirplan?'':'cero'}"><td title="${esc(r.clave)}">${r.cod} ${esc(r.nom)}</td><td class="n">${f(r.decretado)}</td><td class="n">${f(r.cgr)}</td><td class="n">${f(r.dipres)}</td><td class="n ${r.dirplan<-0.5?'neg':''}">${f(r.dirplan)}</td><td class="n"><b>${f(r.totDec)}</b></td></tr>`; });
  dh+=`<tr class="total"><td>Estado</td><td class="n">${f(C.dec.decretado)}</td><td class="n">${f(C.dec.cgr)}</td><td class="n">${f(C.dec.dipres)}</td><td class="n">${f(C.dec.dirplan)}</td><td class="n">${f(C.dec.tot)}</td></tr></tbody>`;
  $('tDec').innerHTML=dh;

  // Contratos
  const lista=M.contracts[b]||[]; const corte=A+'-12-31';
  const grupos={}; lista.forEach(c=>(grupos[c[0]]||(grupos[c[0]]=[])).push(c));
  const cods=Object.keys(grupos).sort();
  $('subCon').textContent=`Montos en M$ · fecha de término anterior al 31-12-${A} se marca en rojo (financiar a diciembre)`;
  $('contratos').innerHTML=cods.length?cods.map(cod=>{
    const nom=(ASIGS.find(a=>a[0]===cod)||[0,''])[1];
    return `<div class="asig-bloque"><h3><span class="badge">${esc(cod)}</span>${esc(nom)} · ${grupos[cod].length} contrato${grupos[cod].length>1?'s':''}</h3><div class="scroll"><table>
      <thead><tr><th>SAFI</th><th>Contrato original</th><th>Estado de contrato</th><th>Fecha de término</th><th class="n">Total pagado</th><th class="n">Saldo vigente</th></tr></thead><tbody>`+
      grupos[cod].map(c=>{ const vence=c[4] && c[4]<corte;
        return `<tr><td class="num" style="text-align:left">${esc(c[1])||'-'}</td><td class="num" style="text-align:left">${esc(c[2])||'-'}</td><td>${esc(c[3])||'-'}</td><td class="${vence?'vence':''}" ${vence?'title="Financiar a diciembre"':''}>${fecha(c[4])||'-'}</td><td class="n">${f(c[5])}</td><td class="n">${f(c[6])}</td></tr>`;}).join('')+
      '</tbody></table></div></div>'; }).join(''):'<p class="vacio">Este BIP no tiene contratos registrados en BD_CONSOLIDADO.</p>';

  try{ localStorage.setItem(LS_BIP,b); }catch(e){}
  if(location.hash!=='#bip='+b) history.replaceState(null,'','#bip='+encodeURIComponent(b));
}

function frescura(){
  const m=M.meta; $('frescura').innerHTML=`Datos SAFI al ${fecha(m.fechaSafi)||'-'}<br>Decretos al ${fecha(m.fechaDecreto)||'-'} · ${fmtN.format(Object.keys(M.bips).length)} BIP`;
}

// ---------- Buscador de BIP (reemplaza la segmentación de datos) ----------
const inp=$('bip'), lst=$('lista'); let idx=[], sel=-1, actual='';
function indice(){ idx=Object.keys(M.bips).sort().map(b=>({b,n:M.names[b]||'',q:(b+' '+(M.names[b]||'')).toLowerCase()})); }
function abrir(q){
  q=(q||'').trim().toLowerCase();
  const res=(q?idx.filter(x=>x.q.includes(q)):idx).slice(0,60);
  lst.innerHTML=res.length?res.map((x,i)=>`<button type="button" role="option" data-b="${esc(x.b)}" aria-selected="${i===0}"><b>${esc(x.b)}</b><span>${esc(x.n)}</span></button>`).join(''):'<p class="vacio">Sin resultados</p>';
  sel=res.length?0:-1; lst.classList.add('abierta'); inp.setAttribute('aria-expanded','true');
}
function cerrar(){ lst.classList.remove('abierta'); inp.setAttribute('aria-expanded','false'); }
function elegir(b){ cerrar(); if(M.bips[b]){ actual=b; render(b); } else inp.value=actual; }
inp.addEventListener('focus',()=>{ inp.select(); abrir(''); });
inp.addEventListener('input',()=>abrir(inp.value));
inp.addEventListener('keydown',e=>{
  const bs=[...lst.querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!bs.length) return; sel=(sel+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length; bs.forEach((x,i)=>x.setAttribute('aria-selected',i===sel)); bs[sel].scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); if(bs[sel]) elegir(bs[sel].dataset.b); else elegir(inp.value.trim()); inp.blur(); }
  else if(e.key==='Escape'){ cerrar(); inp.value=actual; inp.blur(); }
});
lst.addEventListener('mousedown',e=>{ const t=e.target.closest('button'); if(t){ e.preventDefault(); elegir(t.dataset.b); inp.blur(); } });
inp.addEventListener('blur',()=>setTimeout(()=>{ cerrar(); if(inp.value!==actual) inp.value=actual; },120));

// ---------- Actualización desde Excel y publicación ----------
const velo=$('velo');
function modal(t,p,{carga=false,lista=[],acciones=[]}={}){
  $('veloT').textContent=t; $('veloP').textContent=p;
  $('veloBarra').style.display=carga?'block':'none';
  $('veloL').innerHTML=lista.map(x=>`<li>${esc(x)}</li>`).join('');
  const a=$('veloA'); a.innerHTML=''; acciones.forEach(([txt,cls,fn])=>{ const bt=document.createElement('button'); bt.type='button'; bt.className='btn '+cls; bt.textContent=txt; bt.onclick=fn; a.appendChild(bt); });
  velo.classList.add('on'); const first=a.querySelector('button'); if(first) first.focus();
}
const cerrarModal=()=>velo.classList.remove('on');
const pausa=()=>new Promise(r=>setTimeout(r,60));

async function procesar(file){
  if(!file) return;
  if(!/\.xls[xm]$/i.test(file.name)){ modal('Archivo no compatible','Carga la Planilla de Análisis BIP en formato .xlsx.',{acciones:[['Cerrar','sec',cerrarModal]]}); return; }
  modal('Actualizando datos',`Leyendo ${file.name}. Un archivo de ~30 MB tarda entre 10 y 40 segundos.`,{carga:true});
  try{
    const X=window.XLSX; if(!X) throw new Error('No se pudo cargar el lector de Excel (XLSX).');
    await pausa();
    const buf=await file.arrayBuffer(); await pausa();
    const wb=X.read(buf,{type:'array',sheets:SHEETS,cellFormula:false,cellHTML:false,cellText:false,cellStyles:false}); await pausa();
    const nuevo=extractModel(X,wb);
    if(!Object.keys(nuevo.bips).length) throw new Error('No se encontraron BIP en la hoja BD_CONSOLIDADO.');
    M=nuevo; indice(); frescura();
    try{ localStorage.setItem(LS_MODEL,JSON.stringify(M)); }catch(e){}
    const b=M.bips[actual]?actual:M.meta.defaultBip; actual=b; render(b);
    const fmtN2=new Intl.NumberFormat('es-CL',{maximumFractionDigits:0});
    const resumen=`${fmtN2.format(Object.keys(M.bips).length)} BIP cargados. Datos SAFI al ${fecha(M.meta.fechaSafi)}, decretos al ${fecha(M.meta.fechaDecreto)}. Publica la actualización para que Ariel vea estos datos.`;
    modal('Datos actualizados',resumen,{lista:M.warn,acciones:[
      ['Ver solo en este equipo','sec',cerrarModal],
      ['Publicar para todos','prim',pedirTokenYPublicar]
    ]});
  }catch(err){
    console.error(err);
    modal('No se pudo leer el archivo',(err&&err.message)||String(err),{lista:['Verifica que sea la Planilla de Análisis BIP con las hojas P_SAFI, Libro_Decreto, BD_CONSOLIDADO y BcoInt.','Guarda el archivo en Excel después de recalcular, así se incluyen los valores de las fórmulas.'],acciones:[['Cerrar','sec',cerrarModal]]});
  }
}

function pedirTokenYPublicar(){
  $('veloT').textContent='Publicar actualización';
  $('veloBarra').style.display='none'; $('veloL').innerHTML='';
  $('veloP').innerHTML='Ingresa el token de publicación para que Ariel vea los nuevos datos.'+
    '<label style="display:block;margin:10px 0 4px;font-weight:600">Token de publicación</label>'+
    '<input id="tokenPub" type="password" placeholder="Token de publicación" style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid var(--linea);font:inherit">';
  const a=$('veloA'); a.innerHTML='';
  const btnCancel=document.createElement('button'); btnCancel.type='button'; btnCancel.className='btn sec'; btnCancel.textContent='Cancelar'; btnCancel.onclick=cerrarModal;
  const btnPub=document.createElement('button'); btnPub.type='button'; btnPub.id='btnPublicar'; btnPub.className='btn prim'; btnPub.textContent='Publicar';
  btnPub.onclick=async ()=>{
    const campo=$('tokenPub'); const tok=campo?campo.value.trim():'';
    if(!tok){ campo&&campo.focus(); return; }
    tokenPublicar=tok;
    await publicar(tok);
  };
  a.appendChild(btnCancel); a.appendChild(btnPub);
  velo.classList.add('on');
  const campo=$('tokenPub'); if(campo){ campo.value=tokenPublicar; campo.focus(); campo.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); btnPub.click(); } }); }
}

async function publicar(token){
  modal('Publicando','Cifrando y guardando la nueva versión del dashboard…',{carga:true});
  try{
    const texto=JSON.stringify(M);
    const payload=await cifrarTexto(crypto.subtle,claveActual,texto);
    const resp=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});
    if(!resp.ok){ const t=await resp.text().catch(()=>''); throw new Error('HTTP '+resp.status+' '+t); }
    modal('Publicado','Listo, los datos quedaron publicados.',{acciones:[['Listo','sec',cerrarModal]]});
  }catch(e){
    modal('No se publicó',(e&&e.message)||String(e),{acciones:[['Reintentar','prim',pedirTokenYPublicar],['Cerrar','sec',cerrarModal]]});
  }
}

$('btnCargar').addEventListener('click',()=>$('archivo').click());
$('btnSalir').addEventListener('click',()=>{
  modal('Salir del dashboard','Vas a salir y se pedirá la clave de acceso nuevamente. Si actualizaste datos con Excel y aún no los publicaste, esos cambios se perderán en este navegador.',
    {acciones:[['Cancelar','sec',cerrarModal],['Salir','prim',()=>{ try{ localStorage.removeItem(LS_MODEL); localStorage.removeItem(LS_BIP); }catch(e){} location.hash=''; location.reload(); }]]});
});
$('archivo').addEventListener('change',e=>{ procesar(e.target.files[0]); e.target.value=''; });
const zona=$('soltar'); let dd=0;
window.addEventListener('dragenter',e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')){ dd++; zona.classList.add('on'); } });
window.addEventListener('dragleave',()=>{ dd=Math.max(0,dd-1); if(!dd) zona.classList.remove('on'); });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); dd=0; zona.classList.remove('on'); const fl=e.dataTransfer?.files?.[0]; if(fl) procesar(fl); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && velo.classList.contains('on') && $('veloBarra').style.display==='none') cerrarModal(); });

// ---------- Inicio (tras desbloquear) ----------
indice(); frescura();
let inicial=decodeURIComponent((location.hash.match(/bip=([^&]+)/)||[])[1]||'');
if(!M.bips[inicial]){ try{ inicial=localStorage.getItem(LS_BIP)||''; }catch(e){ inicial=''; } }
if(!M.bips[inicial]) inicial=M.meta.defaultBip;
actual=inicial; render(inicial);
window.addEventListener('hashchange',()=>{ const b=decodeURIComponent((location.hash.match(/bip=([^&]+)/)||[])[1]||''); if(M.bips[b]&&b!==actual){ actual=b; render(b);} });
} // fin arrancar()

document.addEventListener('DOMContentLoaded', iniciar);
})();

</script>
